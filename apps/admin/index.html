<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Flor de Lótus</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#d98f7a" />
  <meta name="description" content="Painel de pedidos — Flor de Lótus Delivery" />
  
  <!-- Icons PWA -->
  <link rel="icon" type="image/png" sizes="192x192" href="../cardapio/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../cardapio/icons/icon-512.png" />
  <link rel="apple-touch-icon" href="../cardapio/icons/icon-192.png" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0b0b0b;
      color: #f0f0f0;
      line-height: 1.5;
    }

    .pin-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a1a 0%, #0b0b0b 100%);
      z-index: 1000;
    }

    .pin-screen h1 {
      font-size: 1.5rem;
      margin-bottom: 2rem;
      color: #d98f7a;
    }

    .pin-input {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .pin-input input {
      width: 50px;
      height: 50px;
      font-size: 1.5rem;
      text-align: center;
      border: 2px solid #d98f7a;
      border-radius: 8px;
      background: #1a1a1a;
      color: #f0f0f0;
    }

    .pin-input input:focus {
      outline: none;
      border-color: #ff9f8a;
      box-shadow: 0 0 10px rgba(217, 143, 122, 0.5);
    }

    .pin-btn {
      padding: 0.75rem 2rem;
      font-size: 1rem;
      background: #d98f7a;
      color: #0b0b0b;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
    }

    .pin-btn:hover {
      background: #ff9f8a;
      transform: translateY(-2px);
    }

    .pin-btn:active {
      transform: translateY(0);
    }

    /* Dashboard */
    #dashboard {
      display: none;
      padding: 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .dashboard-header h1 {
      font-size: 1.8rem;
      color: #d98f7a;
    }

    .dashboard-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.5rem 1rem;
      background: #d98f7a;
      color: #0b0b0b;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
      font-size: 0.9rem;
    }

    .btn:hover {
      background: #ff9f8a;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: #404040;
      color: #f0f0f0;
    }

    .btn-secondary:hover {
      background: #505050;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: #1a1a1a;
      padding: 1rem;
      border-radius: 8px;
      border-left: 4px solid #d98f7a;
    }

    .stat-card h3 {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 0.5rem;
    }

    .stat-card .number {
      font-size: 1.8rem;
      color: #d98f7a;
      font-weight: bold;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      overflow-x: auto;
      border-bottom: 2px solid #303030;
      padding-bottom: 0;
    }

    .tab {
      padding: 0.75rem 1.5rem;
      background: transparent;
      border: none;
      color: #888;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
      font-weight: bold;
      white-space: nowrap;
    }

    .tab.active {
      color: #d98f7a;
      border-bottom-color: #d98f7a;
    }

    .orders-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.5rem;
    }

    .order-card {
      background: #1a1a1a;
      border: 1px solid #303030;
      border-radius: 8px;
      padding: 1.5rem;
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .order-card:hover {
      border-color: #d98f7a;
      box-shadow: 0 4px 15px rgba(217, 143, 122, 0.2);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .order-id {
      font-size: 0.9rem;
      color: #888;
      font-family: monospace;
    }

    .order-status {
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      background: #303030;
      color: #888;
    }

    .order-status.pendente {
      background: #6b3a30;
      color: #ff9f8a;
    }

    .order-status.preparando {
      background: #4a4a30;
      color: #ffdd57;
    }

    .order-status.pronto {
      background: #30493a;
      color: #4caf50;
    }

    .order-status.entregue {
      background: #304040;
      color: #00bcd4;
    }

    .order-client {
      font-size: 1.1rem;
      font-weight: bold;
      color: #f0f0f0;
      word-break: break-word;
    }

    .order-phone {
      font-size: 0.9rem;
      color: #888;
      font-family: monospace;
    }

    .order-address {
      font-size: 0.9rem;
      color: #aaa;
      padding: 0.75rem;
      background: #0b0b0b;
      border-radius: 6px;
      border-left: 3px solid #d98f7a;
      word-break: break-word;
      white-space: normal;
    }

    .order-items {
      background: #0b0b0b;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid #303030;
    }

    .order-item:last-child {
      border-bottom: none;
    }

    .order-item-qty {
      color: #d98f7a;
      font-weight: bold;
      margin-right: 0.5rem;
    }

    .order-item-name {
      flex: 1;
      word-break: break-word;
    }

    .order-item-price {
      color: #888;
      font-size: 0.85rem;
      margin-left: 0.5rem;
    }

    .order-description {
      background: #0b0b0b;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #aaa;
      border-left: 3px solid #d98f7a;
      max-height: 100px;
      overflow-y: auto;
      word-break: break-word;
      white-space: normal;
    }

    .order-datetime {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 0.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #303030;
    }

    .order-total {
      font-size: 1.2rem;
      font-weight: bold;
      color: #d98f7a;
      padding-top: 1rem;
      border-top: 1px solid #303030;
      text-align: right;
    }

    .order-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .order-actions button {
      flex: 1;
      padding: 0.6rem 0.75rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      transition: all 0.3s;
      min-width: 100px;
    }

    .btn-status {
      background: #303030;
      color: #f0f0f0;
    }

    .btn-status:hover {
      background: #404040;
    }

    .btn-remove {
      background: #6b3a30;
      color: #ff9f8a;
    }

    .btn-remove:hover {
      background: #8b4a40;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: #888;
    }

    .spinner {
      border: 3px solid #303030;
      border-top: 3px solid #d98f7a;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: #2a2a2a;
      color: #f0f0f0;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      border-left: 4px solid #d98f7a;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      z-index: 100;
      transition: bottom 0.3s ease;
      max-width: 90%;
    }

    .toast.show {
      bottom: 2rem;
    }

    .toast.error {
      border-left-color: #ff6b6b;
      background: #3a2a2a;
    }

    .toast.success {
      border-left-color: #4caf50;
      background: #2a3a2a;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #888;
    }

    .empty-state h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #aaa;
    }

    @media (max-width: 768px) {
      .dashboard-header {
        flex-direction: column;
        align-items: stretch;
      }

      .dashboard-header h1 {
        font-size: 1.4rem;
      }

      .stats {
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      }

      .orders-container {
        grid-template-columns: 1fr;
      }

      .order-card {
        padding: 1rem;
      }

      .tabs {
        gap: 0.25rem;
      }

      .tab {
        padding: 0.6rem 1rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <!-- PIN Screen -->
  <div id="pinScreen" class="pin-screen">
    <h1>🔐 Admin Lótus</h1>
    <div class="pin-input">
      <input type="password" id="pin1" maxlength="1" inputmode="numeric" />
      <input type="password" id="pin2" maxlength="1" inputmode="numeric" />
      <input type="password" id="pin3" maxlength="1" inputmode="numeric" />
      <input type="password" id="pin4" maxlength="1" inputmode="numeric" />
    </div>
    <button class="pin-btn" onclick="verifyPin()">Entrar</button>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <div class="dashboard-header">
      <h1>🍣 Admin Lótus</h1>
      <div class="dashboard-actions">
        <button class="btn btn-secondary" onclick="refreshOrders()">🔄 Atualizar</button>
        <button class="btn btn-secondary" onclick="logout()">Sair</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <h3>📋 Pendentes</h3>
        <div class="number" id="statPendente">0</div>
      </div>
      <div class="stat-card">
        <h3>👨‍🍳 Preparando</h3>
        <div class="number" id="statPreparando">0</div>
      </div>
      <div class="stat-card">
        <h3>✅ Pronto</h3>
        <div class="number" id="statPronto">0</div>
      </div>
      <div class="stat-card">
        <h3>🚚 Entregues</h3>
        <div class="number" id="statEntregue">0</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('pendente')">Pendentes</button>
      <button class="tab" onclick="switchTab('preparando')">Preparando</button>
      <button class="tab" onclick="switchTab('pronto')">Pronto</button>
      <button class="tab" onclick="switchTab('historico')">Histórico</button>
    </div>

    <!-- Orders -->
    <div id="ordersContainer" class="orders-container"></div>
  </div>

  <!-- Toasts -->
  <div id="newOrderToast" class="toast">
    🔔 Novo pedido recebido!
  </div>
  <div id="errorToast" class="toast error"></div>
  <div id="successToast" class="toast success"></div>

  <script>
    // ============ CONFIG ============
    const SUPABASE_URL = 'https://aflglnnruovheztrqneg.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmbGdsbm5ydW92aGV6dHJxbmVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMDAwNjUsImV4cCI6MjA5Mzg3NjA2NX0.2LOqKN-SX52PbhBtLZA4cHpmjnj3hnOb9qz2N1ROYdU';
    const ADMIN_PIN = '1234';

    const $ = (id) => document.getElementById(id);
    const db = {
      select: (query) => fetch(`${SUPABASE_URL}/rest/v1/${query}`, {
        headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}` }
      }).then(r => r.json()),
      
      update: (table, data, id) => fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
        method: 'PATCH',
        headers: { 
          'apikey': SUPABASE_ANON, 
          'Authorization': `Bearer ${SUPABASE_ANON}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      }).then(r => r.json())
    };

    let orders = [];
    let activeTab = 'pendente';
    let realtimeUnsubscribe = null;

    // ============ PIN ============
    function verifyPin() {
      const pins = [
        $('pin1').value,
        $('pin2').value,
        $('pin3').value,
        $('pin4').value
      ].join('');

      if (pins === ADMIN_PIN) {
        enterDashboard();
      } else {
        showError('PIN incorreto!');
        [$('pin1'), $('pin2'), $('pin3'), $('pin4')].forEach(el => el.value = '');
        $('pin1').focus();
      }
    }

    // Auto-focus PIN inputs
    [$('pin1'), $('pin2'), $('pin3'), $('pin4')].forEach((input, i, arr) => {
      input?.addEventListener('keyup', (e) => {
        if (e.key === 'Backspace') {
          input.value = '';
          arr[i - 1]?.focus();
        } else if (input.value && i < 3) {
          arr[i + 1].focus();
        } else if (input.value && i === 3) {
          verifyPin();
        }
      });
    });

    // ============ DASHBOARD ============
    async function enterDashboard() {
      $('pinScreen').style.display = 'none';
      $('dashboard').style.display = 'block';
      
      await loadOrders();
      subscribeRealtime();
      requestNotificationPermission();
      registerServiceWorker();
    }

    async function loadOrders() {
      showLoading(true);
      try {
        const data = await db.select('orders?select=*&order=created_at.desc');
        console.log('[loadOrders] Raw data from Supabase:', data);
        
        if (Array.isArray(data)) {
          orders = data.map(o => {
            // Debug: log primeiro pedido para entender estrutura
            if (orders.length === 0) {
              console.log('[loadOrders] First order structure:', o);
              console.log('[loadOrders] Items field:', o.items, 'Type:', typeof o.items);
            }
            return o;
          });
          
          updateStats();
          renderOrders();
        } else if (data.error) {
          showError(`Erro ao carregar pedidos: ${data.error.message}`);
          console.error('[loadOrders] Supabase error:', data.error);
        } else {
          console.warn('[loadOrders] Unexpected data format:', data);
          showError('Formato de dados inesperado do servidor');
        }
      } catch (err) {
        showError('Erro ao conectar ao servidor');
        console.error('[loadOrders]', err);
      } finally {
        showLoading(false);
      }
    }

    function subscribeRealtime() {
      if (realtimeUnsubscribe) realtimeUnsubscribe();
      
      // Polling como fallback (Supabase Realtime pode ter limitações em app mobile)
      setInterval(async () => {
        const newOrders = await db.select('orders?select=*&status=eq.pendente&order=created_at.desc&limit=1');
        if (Array.isArray(newOrders) && newOrders.length > 0) {
          const exists = orders.find(o => o.id === newOrders[0].id);
          if (!exists) {
            notifyNewOrder(newOrders[0]);
            await loadOrders();
          }
        }
      }, 10000); // A cada 10 segundos
    }

    // ============ STATUS UPDATE ============
    async function updateStatus(orderId, newStatus) {
      const order = orders.find(o => o.id === orderId);
      if (!order) return;

      const oldStatus = order.status;
      order.status = newStatus; // Otimista
      renderOrders();

      try {
        const result = await db.update('orders', { status: newStatus }, orderId);
        
        if (result.error) {
          // RLS blocking the update
          order.status = oldStatus; // Reverte
          renderOrders();
          showError(`❌ Erro ao atualizar status.\n\n⚠️ IMPORTANTE: Verifique as políticas RLS do Supabase.\nA chave anon pode não ter permissão para UPDATE.\n\nErro: ${result.error.message}`);
          console.error('[updateStatus] RLS error:', result.error);
        } else {
          showSuccess(`✅ Pedido ${orderId.slice(-6)} → ${newStatus}`);
        }
      } catch (err) {
        order.status = oldStatus;
        renderOrders();
        showError(`Erro ao conectar: ${err.message}`);
        console.error('[updateStatus]', err);
      }
    }

    // ============ RENDER ============
    function updateStats() {
      $('statPendente').textContent = orders.filter(o => o.status === 'pendente').length;
      $('statPreparando').textContent = orders.filter(o => o.status === 'preparando').length;
      $('statPronto').textContent = orders.filter(o => o.status === 'pronto').length;
      $('statEntregue').textContent = orders.filter(o => o.status === 'entregue').length;
    }

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      event.target.classList.add('active');
      renderOrders();
    }

    function formatDateTime(isoString) {
      if (!isoString) return 'Data desconhecida';
      try {
        const date = new Date(isoString);
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        return `${day}/${month}/${year} às ${hours}:${minutes}`;
      } catch (e) {
        return 'Data inválida';
      }
    }

    function parseItems(itemsData) {
      // Se items for string JSON, fazer parse
      if (typeof itemsData === 'string') {
        try {
          return JSON.parse(itemsData);
        } catch (e) {
          console.warn('[parseItems] Failed to parse items string:', itemsData, e);
          return [];
        }
      }
      // Se for array, retornar direto
      if (Array.isArray(itemsData)) {
        return itemsData;
      }
      // Senão, retornar vazio
      return [];
    }

    function renderOrders() {
      let filtered = orders;

      if (activeTab === 'pendente') {
        filtered = orders.filter(o => o.status === 'pendente');
      } else if (activeTab === 'preparando') {
        filtered = orders.filter(o => o.status === 'preparando');
      } else if (activeTab === 'pronto') {
        filtered = orders.filter(o => o.status === 'pronto');
      } else if (activeTab === 'historico') {
        filtered = orders.filter(o => o.status === 'entregue');
      }

      const container = $('ordersContainer');
      
      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <h2>📭 Sem pedidos</h2>
            <p>Nenhum pedido nesta categoria</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(o => {
        const items = parseItems(o.items);
        const itemsHTML = items.length > 0 
          ? items.map(item => `
              <div class="order-item">
                <span class="order-item-qty">${item.quantity}x</span>
                <span class="order-item-name">${item.name || 'Item sem nome'}</span>
                <span class="order-item-price">${item.price ? `R$ ${(item.price * item.quantity).toFixed(2)}` : ''}</span>
              </div>
            `).join('')
          : '<div class="order-item"><span style="color: #888;">Nenhum item</span></div>';

        return `
        <div class="order-card">
          <div class="order-header">
            <div>
              <div class="order-id">#${String(o.id).slice(-6).toUpperCase()}</div>
              <div class="order-client">${o.client_name || 'Cliente'}</div>
              <div class="order-phone">${o.client_phone || 'N/A'}</div>
            </div>
            <span class="order-status ${o.status}">${o.status}</span>
          </div>

          <div class="order-datetime">
            🕐 ${formatDateTime(o.created_at)}
          </div>

          <div class="order-address">
            <strong>📍 Endereço:</strong><br/>
            ${o.client_address || 'Não informado'}
          </div>

          <div class="order-items">
            <strong>🍜 Itens:</strong>
            ${itemsHTML}
          </div>

          ${o.special_notes ? `
            <div class="order-description">
              <strong>📝 Observações:</strong><br/>
              ${o.special_notes}
            </div>
          ` : ''}

          <div class="order-total">
            Total: R$ ${(o.total || 0).toFixed(2)}
          </div>

          <div class="order-actions">
            ${o.status === 'pendente' ? `<button class="order-actions button btn-status" onclick="updateStatus('${o.id}', 'preparando')">👨‍🍳 Preparar</button>` : ''}
            ${o.status === 'preparando' ? `<button class="order-actions button btn-status" onclick="updateStatus('${o.id}', 'pronto')">✅ Pronto</button>` : ''}
            ${o.status === 'pronto' ? `<button class="order-actions button btn-status" onclick="updateStatus('${o.id}', 'entregue')">🚚 Entregue</button>` : ''}
            ${o.status !== 'entregue' ? `<button class="order-actions button btn-remove" onclick="removeOrder('${o.id}')">🗑️ Remover</button>` : ''}
          </div>
        </div>
      `;
      }).join('');
    }

    // ============ NOTIFICATIONS ============
    function notifyNewOrder(order) {
      // Sound + Visual Toast
      beepBell();
      showToast(`🔔 Novo pedido de ${order.client_name || 'Cliente'}`);

      // Browser Notification (se permitido)
      if (Notification.permission === 'granted') {
        new Notification('🍣 Novo Pedido!', {
          body: `${order.client_name || 'Cliente'} — R$ ${(order.total || 0).toFixed(2)}`,
          icon: '../cardapio/icons/icon-192.png',
          tag: `order-${order.id}`,
          requireInteraction: false
        });
      }

      // Vibrate
      if (navigator.vibrate) {
        navigator.vibrate([300, 100, 300, 100, 300]);
      }
    }

    function beepBell() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const t = ctx.currentTime;

        function note(freq, start, dur, gain = 0.3) {
          const osc = ctx.createOscillator();
          const env = ctx.createGain();
          osc.connect(env);
          env.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.value = freq;
          env.gain.setValueAtTime(0, start);
          env.gain.linearRampToValueAtTime(gain, start + 0.05);
          env.gain.exponentialRampToValueAtTime(0.001, start + dur);
          osc.start(start);
          osc.stop(start + dur);
        }

        // Chime melody
        note(523, t, 0.8);        // C5
        note(659, t + 0.1, 0.8);  // E5
        note(784, t + 0.2, 0.8);  // G5
        note(1047, t + 0.35, 1.2, 0.2); // C6 (high, softer)

        if (ctx.state === 'suspended') ctx.resume();
      } catch (err) {
        console.warn('[beepBell]', err);
      }
    }

    function requestNotificationPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().then(perm => {
          if (perm === 'granted') {
            showSuccess('✅ Notificações ativadas');
          }
        });
      }
    }

    // ============ SERVICE WORKER ============
    function registerServiceWorker() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            console.log('[SW] Registered:', reg);
            // Request periodic background sync
            if ('periodicSync' in reg) {
              reg.periodicSync.register('fl-check-orders', {
                minInterval: 24 * 60 * 60 * 1000 // 24h (Chrome decides actual frequency)
              }).catch(() => {
                console.log('[SW] Periodic sync not available or denied');
              });
            }
          })
          .catch(err => {
            console.warn('[SW] Registration failed:', err);
          });
      }
    }

    // ============ UTILS ============
    function removeOrder(orderId) {
      if (confirm('Tem certeza que quer remover este pedido?')) {
        orders = orders.filter(o => o.id !== orderId);
        updateStats();
        renderOrders();
        showSuccess('Pedido removido');
      }
    }

    function refreshOrders() {
      loadOrders();
    }

    function logout() {
      if (confirm('Sair do painel?')) {
        $('dashboard').style.display = 'none';
        $('pinScreen').style.display = 'flex';
        [$('pin1'), $('pin2'), $('pin3'), $('pin4')].forEach(el => el.value = '');
        $('pin1').focus();
      }
    }

    function showLoading(show) {
      const html = show 
        ? `<div class="loading"><div class="spinner"></div>Carregando...</div>`
        : '';
      if (show) {
        $('ordersContainer').innerHTML = html;
      }
    }

    function showToast(msg) {
      const toast = $('newOrderToast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4000);
    }

    function showError(msg) {
      const toast = $('errorToast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 5000);
    }

    function showSuccess(msg) {
      const toast = $('successToast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Init
    $('pin1').focus();
  </script>
</body>
</html>
