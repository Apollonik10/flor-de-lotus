<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Flor de Lótus</title>

  <link rel="manifest" href="./admin-manifest.json" />
  <meta name="theme-color" content="#d98f7a" />
  <meta name="description" content="Painel de pedidos — Flor de Lótus Delivery" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Admin Lótus" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="icon" type="image/jpeg" href="./mascot-icon.jpg" />
  <link rel="apple-touch-icon" href="./mascot-icon.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --pink-light:  #f3d7cf;
      --pink:        #e8b4a2;
      --pink-dark:   #d98f7a;
      --pink-hot:    #c47a65;
      --bg:          #0b0b0b;
      --bg2:         #111111;
      --bg3:         #1a1a1a;
      --bg4:         #222222;
      --border:      #2a2a2a;
      --border2:     #333333;
      --text:        #f0ebe8;
      --text-muted:  #888880;
      --text-dim:    #555550;
      --shadow:      rgba(0,0,0,0.6);
      --glow:        rgba(217,143,122,0.18);
      --green:       #4caf50;
      --red:         #ff6b6b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100dvh;
    }

    /* ═══════════════════════ PIN SCREEN ═══════════════════════ */
    .pin-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, #1e1210 0%, var(--bg) 70%);
      z-index: 1000; gap: 0.5rem;
    }

    .pin-logo {
      width: 80px; height: 80px;
      border-radius: 20px;
      object-fit: cover;
      border: 2px solid var(--pink-dark);
      box-shadow: 0 0 30px var(--glow);
      margin-bottom: 0.75rem;
    }

    .pin-screen h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem; font-weight: 600;
      color: var(--pink-dark);
      letter-spacing: 0.03em;
    }

    .pin-screen p {
      font-size: 0.85rem; color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .pin-input {
      display: flex; gap: 0.75rem; margin-bottom: 1.5rem;
    }

    .pin-input input {
      width: 56px; height: 56px;
      font-size: 1.5rem; text-align: center;
      border: 2px solid var(--border2);
      border-radius: 12px;
      background: var(--bg3); color: var(--text);
      transition: all 0.2s;
    }

    .pin-input input:focus {
      outline: none;
      border-color: var(--pink-dark);
      box-shadow: 0 0 0 3px var(--glow);
    }

    .pin-btn {
      padding: 0.8rem 3rem; font-size: 1rem;
      background: linear-gradient(135deg, var(--pink-dark), var(--pink-hot));
      color: var(--bg); border: none; border-radius: 12px;
      cursor: pointer; font-weight: 700;
      transition: all 0.25s; font-family: 'Outfit', sans-serif;
      box-shadow: 0 4px 16px rgba(217,143,122,0.3);
    }

    .pin-btn:hover  { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(217,143,122,0.4); }
    .pin-btn:active { transform: translateY(0); }

    .pin-error {
      font-size: 0.85rem; color: #ff8070;
      min-height: 1.2rem; margin-top: 0.5rem;
    }

    /* ═══════════════════════ HEADER ═══════════════════════ */
    .app-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(11,11,11,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      display: flex; align-items: center;
      justify-content: space-between; gap: 1rem;
    }

    .header-brand {
      display: flex; align-items: center; gap: 0.75rem;
    }

    .header-mascot {
      width: 38px; height: 38px;
      border-radius: 10px; object-fit: cover;
      border: 1px solid var(--pink-dark);
    }

    .header-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem; font-weight: 600;
      color: var(--pink-dark);
    }

    .header-subtitle {
      font-size: 0.75rem; color: var(--text-muted);
      margin-top: -2px;
      display: flex; align-items: center; gap: 6px;
    }

    .header-actions { display: flex; gap: 0.5rem; align-items: center; }

    .realtime-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #3c3c3c; transition: background 0.3s;
      flex-shrink: 0;
    }
    .realtime-dot.connected { background: var(--green); box-shadow: 0 0 6px #4caf5088; }
    .realtime-dot.error     { background: var(--red); }

    .store-badge {
      font-size: 0.65rem; padding: 2px 6px; border-radius: 4px;
      font-weight: 700; text-transform: uppercase;
    }
    .store-badge.open { background: #1a3320; color: var(--green); }
    .store-badge.closed { background: #3d1a14; color: #ff9f8a; }

    /* ═══════════════════════ LAYOUT ═══════════════════════ */
    #dashboard { display: none; }

    .dashboard-inner {
      max-width: 1100px; margin: 0 auto;
      padding: 1.25rem 1rem 4rem;
    }

    /* ═══════════════════════ STATS ═══════════════════════ */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem; margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 1rem;
      cursor: pointer; transition: all 0.2s;
    }

    .stat-card:hover { border-color: var(--pink-dark); transform: translateY(-2px); }
    .stat-card.active-stat { border-color: var(--pink-dark); background: #1e1512; }

    .stat-label {
      font-size: 0.75rem; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.4rem;
    }

    .stat-number {
      font-size: 2rem; font-weight: 700; color: var(--pink-dark);
      font-family: 'Outfit', sans-serif; line-height: 1;
    }

    .stat-card.stat-pendente   .stat-number { color: #ff9f8a; }
    .stat-card.stat-preparando .stat-number { color: #ffdd57; }
    .stat-card.stat-pronto     .stat-number { color: #4caf50; }
    .stat-card.stat-entregue   .stat-number { color: #00bcd4; }

    /* ═══════════════════════ TABS ═══════════════════════ */
    .tabs {
      display: flex; gap: 0; margin-bottom: 1.25rem;
      border-bottom: 2px solid var(--border);
      overflow-x: auto; scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      padding: 0.7rem 1.25rem;
      background: transparent; border: none; border-bottom: 3px solid transparent;
      color: var(--text-muted); cursor: pointer;
      font-weight: 500; white-space: nowrap;
      transition: all 0.2s; font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
    }

    .tab:hover { color: var(--text); }
    .tab.active { color: var(--pink-dark); border-bottom-color: var(--pink-dark); font-weight: 600; }

    .tab .tab-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--pink-dark); color: var(--bg);
      font-size: 0.7rem; font-weight: 700; margin-left: 6px;
    }

    /* ═══════════════════════ SECTIONS ═══════════════════════ */
    .section-content { display: none; }
    .section-content.active { display: block; }

    /* ═══════════════════════ ORDERS ═══════════════════════ */
    .orders-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1rem;
    }

    .order-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: all 0.25s;
    }

    .order-card:hover { border-color: var(--border2); }
    .order-card.new-card { border-color: var(--pink-dark); animation: pulse-border 2s ease 3; }

    @keyframes pulse-border {
      0%,100% { box-shadow: 0 0 0 0 var(--glow); }
      50%      { box-shadow: 0 0 0 6px var(--glow); }
    }

    .order-summary {
      padding: 1rem 1.25rem;
      cursor: pointer; user-select: none;
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 1rem;
    }

    .order-summary-left { flex: 1; min-width: 0; }
    .order-meta { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.35rem; flex-wrap: wrap; }
    .order-id { font-size: 0.78rem; color: var(--text-muted); font-family: 'Outfit', monospace; letter-spacing: 0.05em; }
    .order-time { font-size: 0.75rem; color: var(--text-dim); }
    .order-client-name { font-size: 1rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .order-phone { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

    .order-summary-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; flex-shrink: 0; }
    .order-status { padding: 0.3rem 0.75rem; border-radius: 20px; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
    .order-status.pendente   { background: #3d1a14; color: #ff9f8a; }
    .order-status.preparando { background: #3a3310; color: #ffdd57; }
    .order-status.pronto     { background: #1a3320; color: #5cb85c; }
    .order-status.entregue   { background: #102535; color: #4dd0e1; }
    .order-total-preview { font-size: 0.9rem; font-weight: 700; color: var(--pink-dark); }

    .chevron-icon { color: var(--text-dim); font-size: 0.8rem; transition: transform 0.25s; margin-top: 2px; }
    .order-card.open .chevron-icon { transform: rotate(180deg); }

    .order-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; border-top: 0 solid var(--border); }
    .order-card.open .order-body { max-height: 800px; border-top-width: 1px; }
    .order-body-inner { padding: 1rem 1.25rem 1.25rem; }

    .order-section { background: var(--bg2); border-radius: 8px; padding: 0.75rem; margin-bottom: 0.75rem; font-size: 0.88rem; }
    .order-section-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 600; }
    .item-row { display: flex; align-items: baseline; gap: 0.5rem; padding: 0.4rem 0; border-bottom: 1px solid var(--border); }
    .item-row:last-child { border-bottom: none; }
    .item-qty { color: var(--pink-dark); font-weight: 700; min-width: 28px; }
    .item-name { flex: 1; }
    .item-sabor { font-size: 0.78rem; color: var(--text-muted); }
    .item-price { color: var(--text-muted); font-size: 0.82rem; white-space: nowrap; }
    .order-total-row { display: flex; justify-content: space-between; padding-top: 0.6rem; font-weight: 700; font-size: 1rem; color: var(--pink-dark); border-top: 1px solid var(--border2); margin-top: 0.4rem; }
    .order-notes { font-size: 0.85rem; color: #bbb; border-left: 2px solid var(--pink-dark); padding-left: 0.75rem; }

    .order-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
    .order-actions button { flex: 1; min-width: 100px; padding: 0.6rem 0.75rem; border: none; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.2s; font-family: 'Outfit', sans-serif; }
    .btn-pendente-action   { background: #3d1a14; color: #ff9f8a; }
    .btn-preparando-action { background: #3a3310; color: #ffdd57; }
    .btn-pronto-action     { background: #1a3320; color: #5cb85c; }
    .btn-remove { background: #2a1212; color: #ff8070; }

    /* ═══════════════════════ PRODUCTS ═══════════════════════ */
    .products-container {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem;
    }
    .product-card {
      background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .product-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; filter: brightness(0.8); }
    .product-body { padding: 1rem; flex: 1; }
    .product-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.25rem; }
    .product-price { color: var(--pink-dark); font-weight: 700; margin-bottom: 0.5rem; }
    .product-category { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.75rem; }
    .product-actions { display: flex; gap: 0.5rem; border-top: 1px solid var(--border); padding: 0.75rem; }
    .btn-toggle { flex: 1; padding: 0.5rem; font-size: 0.75rem; border-radius: 6px; font-weight: 600; text-align: center; cursor: pointer; border: 1px solid var(--border); }
    .btn-toggle.active { background: #1a3320; color: var(--green); border-color: var(--green); }
    .btn-toggle.inactive { background: #3d1a14; color: #ff9f8a; border-color: #ff9f8a; }
    .btn-edit-prod { padding: 0.5rem; background: var(--bg4); border-radius: 6px; color: var(--text); }
    .btn-add-prod { background: var(--pink-dark); color: var(--bg); border: none; padding: 0.6rem 1.25rem; border-radius: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; margin-bottom: 1.5rem; }

    /* ═══════════════════════ REJECTION MODAL ═══════════════════════ */
    .rejection-wrap { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); display: none; }
    .rejection-wrap.active { display: block; }
    .rejection-input { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text); margin-bottom: 8px; font-size: 0.85rem; }

    /* ═══════════════════════ CONFIG ═══════════════════════ */
    .config-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 1.5rem;
    }
    .config-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; }
    .config-title { font-size: 1rem; font-weight: 600; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 10px; }
    .config-title i { color: var(--pink-dark); }
    
    .status-toggle-wrap { display: flex; align-items: center; justify-content: space-between; background: var(--bg2); padding: 1rem; border-radius: 12px; margin-bottom: 1rem; }
    .panic-btn { padding: 0.75rem 1.5rem; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; border: none; }
    .panic-btn.open { background: var(--green); color: #000; }
    .panic-btn.closed { background: var(--red); color: #000; }

    .hours-grid { display: flex; flex-direction: column; gap: 0.5rem; }
    .hour-row { display: grid; grid-template-columns: 100px 1fr 1fr 60px; align-items: center; gap: 10px; font-size: 0.85rem; padding: 6px 0; border-bottom: 1px solid var(--border); }
    .hour-row:last-child { border-bottom: none; }
    .hour-day { font-weight: 600; }
    .hour-input { background: var(--bg2); border: 1px solid var(--border2); color: var(--text); padding: 4px; border-radius: 4px; font-size: 0.8rem; text-align: center; }
    .hour-closed-check { justify-self: center; }

    /* ═══════════════════════ GLOBAL ═══════════════════════ */
    .btn { padding: 0.5rem 1rem; background: var(--bg4); color: var(--text); border: 1px solid var(--border2); border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s; font-size: 0.85rem; font-family: 'Outfit', sans-serif; }
    .btn:hover { background: var(--bg3); border-color: var(--pink-dark); }
    .btn-primary { background: var(--pink-dark); color: var(--bg); border: none; }
    .btn-logout { color: var(--text-muted); }

    .loading { text-align: center; padding: 3rem 1rem; color: var(--text-muted); grid-column: 1 / -1; }
    .spinner { border: 3px solid var(--border2); border-top: 3px solid var(--pink-dark); border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state { grid-column: 1 / -1; text-align: center; padding: 4rem 1rem; color: var(--text-muted); }
    .empty-state i { font-size: 2.5rem; color: var(--border2); margin-bottom: 1rem; }

    .toast { position: fixed; bottom: -120px; left: 50%; transform: translateX(-50%); padding: 0.9rem 1.5rem; border-radius: 10px; box-shadow: 0 8px 30px var(--shadow); z-index: 200; transition: bottom 0.3s cubic-bezier(.22,1,.36,1); max-width: min(90vw, 400px); width: max-content; font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 0.75rem; }
    .toast.show { bottom: 1.5rem; }
    .toast-new    { background: #1e1512; border: 1px solid var(--pink-dark); color: var(--pink-light); }
    .toast-error  { background: #2a1212; border: 1px solid #ff6b6b; color: #ffaaaa; }
    .toast-success { background: #122212; border: 1px solid #4caf50; color: #a5d6a7; }

    .alarm-overlay { position: fixed; inset: 0; background: rgba(217,143,122,0.08); pointer-events: none; z-index: 90; animation: alarm-flash 0.8s ease infinite; display: none; }
    .alarm-overlay.active { display: block; }
    @keyframes alarm-flash { 0%,100% { opacity: 0; } 50% { opacity: 1; } }

    @media (max-width: 640px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .orders-container, .products-container { grid-template-columns: 1fr; }
      .header-title { font-size: 1.1rem; }
      .tab { padding: 0.6rem 0.9rem; font-size: 0.82rem; }
      .stat-number { font-size: 1.5rem; }
      .hour-row { grid-template-columns: 80px 1fr 1fr 40px; }
    }
  </style>
</head>
<body>

<div id="alarmOverlay" class="alarm-overlay"></div>

<div id="pinScreen" class="pin-screen">
  <img src="./mascot-icon.jpg" alt="Mascote" class="pin-logo" />
  <h1>Admin Lótus</h1>
  <p>Digite o PIN de acesso</p>
  <div class="pin-input">
    <input type="password" id="pin1" maxlength="1" inputmode="numeric" />
    <input type="password" id="pin2" maxlength="1" inputmode="numeric" />
    <input type="password" id="pin3" maxlength="1" inputmode="numeric" />
    <input type="password" id="pin4" maxlength="1" inputmode="numeric" />
    <input type="password" id="pin5" maxlength="1" inputmode="numeric" />
    <input type="password" id="pin6" maxlength="1" inputmode="numeric" />
  </div>
  <button class="pin-btn" id="btnVerify" onclick="verifyPin()">Entrar</button>
  <p class="pin-error" id="pinError"></p>
</div>

<div id="dashboard">
  <header class="app-header">
    <div class="header-brand">
      <img src="./mascot-icon.jpg" alt="Mascote" class="header-mascot" />
      <div>
        <div class="header-title">Admin Lótus</div>
        <div class="header-subtitle">
          <span id="realtimeDot" class="realtime-dot"></span>
          <span id="storeStatusBadge" class="store-badge">...</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="refreshData()" title="Atualizar">
        <i class="fas fa-rotate-right"></i>
      </button>
      <button class="btn btn-logout" onclick="logout()">Sair</button>
    </div>
  </header>

  <div class="dashboard-inner">
    <div class="tabs" id="tabBar">
      <button class="tab active" data-tab="pedidos" onclick="switchMainTab('pedidos')">Pedidos <span class="tab-badge" id="total-pendentes">0</span></button>
      <button class="tab"        data-tab="produtos" onclick="switchMainTab('produtos')">Produtos</button>
      <button class="tab"        data-tab="config"   onclick="switchMainTab('config')">Ajustes</button>
    </div>

    <!-- ══ SEÇÃO PEDIDOS ══ -->
    <div id="section-pedidos" class="section-content active">
      <div class="stats">
        <div class="stat-card stat-pendente" onclick="switchOrderTab('pendente')">
          <div class="stat-label">📋 Pendentes</div>
          <div class="stat-number" id="statPendente">0</div>
        </div>
        <div class="stat-card stat-preparando" onclick="switchOrderTab('preparando')">
          <div class="stat-label">👨‍🍳 Preparando</div>
          <div class="stat-number" id="statPreparando">0</div>
        </div>
        <div class="stat-card stat-pronto" onclick="switchOrderTab('pronto')">
          <div class="stat-label">✅ Pronto</div>
          <div class="stat-number" id="statPronto">0</div>
        </div>
        <div class="stat-card stat-entregue" onclick="switchOrderTab('entregue')">
          <div class="stat-label">🚚 Entregues</div>
          <div class="stat-number" id="statEntregue">0</div>
        </div>
      </div>
      <div class="tabs" style="border-bottom:none; margin-bottom:1rem;">
        <button class="tab order-tab active" data-otab="pendente" onclick="switchOrderTab('pendente')">Pendentes</button>
        <button class="tab order-tab" data-otab="preparando" onclick="switchOrderTab('preparando')">Cozinha</button>
        <button class="tab order-tab" data-otab="pronto" onclick="switchOrderTab('pronto')">Para Entrega</button>
        <button class="tab order-tab" data-otab="entregue" onclick="switchOrderTab('entregue')">Histórico</button>
      </div>

    <!-- ══ SEÇÃO PRODUTOS ══ -->
    <div id="section-produtos" class="section-content">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:1.5rem">

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL  = 'https://aflglnnruovheztrqneg.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmbGdsbm5ydW92aGV6dHJxbmVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMDAwNjUsImV4cCI6MjA5Mzg3NjA2NX0.2LOqKN-SX52PbhBtLZA4cHpmjnj3hnOb9qz2N1ROYdU';
  const ADMIN_EMAIL   = 'admin@flordelotus.com';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: 'fl_admin_session' },
  });

  let orders = [], products = [], categories = [], storeConfig = {};
  let activeMainTab = 'pedidos', activeOrderTab = 'pendente', activeCatFilter = 'todas';
  let rtChannel = null, rtConfigChannel = null, alarmTimer = null, knownIds = new Set(), _audioCtx = null;
  let editingProdId = null;

  const $ = id => document.getElementById(id);

  async function checkSession() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) enterDashboard();
  }

  window.verifyPin = async function() {
    const pin = [1,2,3,4,5,6].map(i => $('pin'+i).value).join('');
    if (pin.length < 6) return;
    const btn = $('btnVerify'), err = $('pinError');
    btn.disabled = true; btn.textContent = '...'; err.textContent = '';
    const { error } = await supabase.auth.signInWithPassword({ email: ADMIN_EMAIL, password: pin });
    if (error) {
      err.textContent = 'PIN incorreto.'; [1,2,3,4,5,6].forEach(i => $('pin'+i).value = ''); $('pin1').focus();
    } else enterDashboard();
    btn.disabled = false; btn.textContent = 'Entrar';
  };

  [1,2,3,4,5,6].forEach((i, idx, arr) => {
    const el = $('pin'+i);
    if(!el) return;
    el.addEventListener('keyup', e => {
      if (e.key === 'Backspace' && idx > 0) $('pin'+arr[idx-1]).focus();
      else if (el.value && idx < 5) $('pin'+arr[idx+1]).focus();
      else if (el.value && idx === 5) window.verifyPin();
    });
  });

  async function enterDashboard() {
    $('pinScreen').style.display = 'none';
    $('dashboard').style.display = 'block';
    await refreshData();
    subscribeRealtime();
    subscribeConfigRealtime();
  }

  async function refreshData() {
    showLoading(true);
    await Promise.all([loadOrders(), loadProducts(), loadConfig()]);
    showLoading(false);
  }
  window.refreshData = refreshData;

  async function loadOrders() {
    const { data } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
    orders = data || [];
    orders.forEach(o => knownIds.add(o.id));
    updateOrderStats();
    if (activeMainTab === 'pedidos') renderOrders();
  }

  async function loadProducts() {
    const [pRes, cRes] = await Promise.all([
      supabase.from('products').select('*').order('name'),
      supabase.from('categories').select('*').order('sort_order')
    ]);
    products = pRes.data || [];
    categories = cRes.data || [];
    renderCategoryFilters();
    if (activeMainTab === 'produtos') renderProducts();
  }

  async function loadConfig() {
    const { data } = await supabase.from('store_config').select('*');
    if (data) {
      data.forEach(c => storeConfig[c.key] = c.value);
      renderConfig();
      updateHeaderStatus();
    }
  }

  function subscribeRealtime() {
    if (rtChannel) supabase.removeChannel(rtChannel);
    rtChannel = supabase.channel('admin-orders').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
      const { eventType, new: newRow, old: oldRow } = payload;
      if (eventType === 'INSERT') {
        if (!knownIds.has(newRow.id)) { knownIds.add(newRow.id); orders.unshift(newRow); triggerNewOrderAlert(newRow); }
      } else if (eventType === 'UPDATE') {
        const idx = orders.findIndex(o => o.id === newRow.id);
        if (idx !== -1) orders[idx] = newRow; else orders.unshift(newRow);
      } else if (eventType === 'DELETE') {
        orders = orders.filter(o => o.id !== oldRow.id);
      }
      updateOrderStats(); renderOrders();
    }).subscribe(s => {
      $('realtimeDot').className = s === 'SUBSCRIBED' ? 'realtime-dot connected' : 'realtime-dot error';
    });
  }

  function subscribeConfigRealtime() {
    if (rtConfigChannel) supabase.removeChannel(rtConfigChannel);
    rtConfigChannel = supabase.channel('admin-config').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'store_config' }, payload => {
      storeConfig[payload.new.key] = payload.new.value;
      renderConfig(); updateHeaderStatus();
    }).subscribe();
  }

  window.switchMainTab = function(tab) {
    activeMainTab = tab;
    document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
    document.querySelectorAll('.section-content').forEach(el => el.classList.toggle('active', el.id === 'section-'+tab));
    if (tab === 'pedidos') renderOrders();
    if (tab === 'produtos') renderProducts();
    if (tab === 'config') renderConfig();
  };

  window.switchOrderTab = function(tab) {
    activeOrderTab = tab;
    document.querySelectorAll('.order-tab').forEach(el => el.classList.toggle('active', el.dataset.otab === tab));
    renderOrders();
  };

  function updateOrderStats() {
    const cnt = s => orders.filter(o => o.status === s).length;
    $('statPendente').textContent = cnt('pendente');
    $('statPreparando').textContent = cnt('preparando');
    $('statPronto').textContent = cnt('pronto');
    $('statEntregue').textContent = cnt('entregue');
    $('total-pendentes').textContent = cnt('pendente');
    $('total-pendentes').style.display = cnt('pendente') ? 'inline-flex' : 'none';
  }

  function renderOrders() {
    const container = $('ordersContainer');
    const filtered = orders.filter(o => activeOrderTab === 'todos' ? true : o.status === activeOrderTab);
    if (!filtered.length) { container.innerHTML = '<div class="empty-state"><i class="fas fa-box-open"></i><p>Nenhum pedido.</p></div>'; return; }
    
    container.innerHTML = filtered.map(o => {
      const items = typeof o.items === 'string' ? JSON.parse(o.items) : o.items;
      const statusBtn = {
        pendente: `<button class="btn-pendente-action" onclick="updateStatus('${o.id}','preparando')"><i class="fas fa-fire"></i> Preparar</button>`,
        preparando: `<button class="btn-preparando-action" onclick="updateStatus('${o.id}','pronto')"><i class="fas fa-bell"></i> Pronto</button>`,
        pronto: `<button class="btn-pronto-action" onclick="updateStatus('${o.id}','entregue')"><i class="fas fa-motorcycle"></i> Entregue</button>`
      }[o.status] || '';

      return `
        <div class="order-card" id="card-${o.id}">
          <div class="order-summary" onclick="toggleCard('${o.id}')">
            <div class="order-summary-left">
              <div class="order-meta"><span class="order-id">#${o.id.slice(-6).toUpperCase()}</span> <span class="order-time">${new Date(o.created_at).toLocaleTimeString()}</span></div>
              <div class="order-client-name">${o.client_name || 'Cliente'}</div>
              ${o.client_phone ? `<div class="order-phone">${o.client_phone}</div>` : ''}
            </div>
            <div class="order-summary-right">
              <span class="order-status ${o.status}">${o.status}</span>
              <span class="order-total-preview">R$ ${Number(o.total).toFixed(2)}</span>
            </div>
          </div>
          <div class="order-body"><div class="order-body-inner">
            ${o.client_address ? `<div class="order-section"><div class="order-section-label">Endereço</div><div class="order-address-text">${o.client_address}</div></div>` : ''}
            <div class="order-section"><div class="order-section-label">Itens</div>
              ${items.map(it => `<div class="item-row"><span class="item-qty">${it.qty}x</span><span class="item-name">${it.nome}</span><span class="item-price">R$ ${Number(it.preco * it.qty).toFixed(2)}</span></div>`).join('')}
            </div>
            ${o.special_notes ? `<div class="order-section"><div class="order-section-label">Observações</div><div class="order-notes">${o.special_notes}</div></div>` : ''}
            
            <div id="rejection-${o.id}" class="rejection-wrap">
              <textarea id="reason-${o.id}" class="rejection-input" placeholder="Motivo do cancelamento (aparecerá para o cliente)..."></textarea>
              <div style="display:flex; gap:8px">
                <button class="btn" onclick="toggleRejection('${o.id}', false)">Voltar</button>
                <button class="btn btn-remove" style="flex:1" onclick="confirmRejection('${o.id}')">Confirmar Cancelamento</button>
              </div>
            </div>

            <div class="order-actions" id="actions-${o.id}">
              ${statusBtn}
              ${o.status === 'pendente' ? `<button class="btn-remove" onclick="toggleRejection('${o.id}', true)"><i class="fas fa-times"></i> Recusar</button>` : ''}
              <button class="btn-remove" onclick="removeOrder('${o.id}')"><i class="fas fa-trash"></i></button>
            </div>
          </div></div>
        </div>`;
    }).join('');
  }

  window.updateStatus = async (id, status) => {
    const { error } = await supabase.from('orders').update({ status }).eq('id', id);
    if (!error) showSuccess('Status atualizado!');
  };

  window.toggleRejection = (id, show) => {
    $(`rejection-${id}`).classList.toggle('active', show);
    $(`actions-${id}`).style.display = show ? 'none' : 'flex';
  };

  window.confirmRejection = async (id) => {
    const reason = $(`reason-${id}`).value || 'Pedido cancelado pelo restaurante.';
    const { error } = await supabase.from('orders').update({ 
      status: 'cancelado',
      rejection_reason: reason 
    }).eq('id', id);
    
    if (!error) showSuccess('Pedido cancelado!');
    else showError('Erro ao cancelar.');
  };

  function renderCategoryFilters() {
    const container = $('categoryFilter');
    const cats = [{id:'todas', name:'Todas'}, ...categories];
    container.innerHTML = cats.map(c => `
      <button class="btn ${activeCatFilter === c.id ? 'btn-primary' : ''}" onclick="filterByCat('${c.id}')">${c.name}</button>
    `).join('');
  }

  window.filterByCat = (id) => { activeCatFilter = id; renderCategoryFilters(); renderProducts(); };

  function renderProducts() {
    const container = $('productsContainer');
    const filtered = activeCatFilter === 'todas' ? products : products.filter(p => p.category_id === activeCatFilter);
    container.innerHTML = filtered.map(p => `
      <div class="product-card">
        <img src="${p.image_url}" class="product-img" onerror="this.src='/flor-de-lotus/public/assets/images/placeholder.jpg'">
        <div class="product-body">
          <div class="product-name">${p.name}</div>
          <div class="product-price">R$ ${Number(p.price).toFixed(2)}</div>
          <div class="product-category">${categories.find(c => c.id === p.category_id)?.name || ''}</div>
          <div style="font-size:0.75rem; color:var(--text-muted); margin-top:4px">${p.portion || ''}</div>
        </div>
        <div class="product-actions">
          <button class="btn-toggle ${p.is_active ? 'active' : 'inactive'}" onclick="toggleProduct('${p.id}', ${p.is_active})">
            ${p.is_active ? 'DISPONÍVEL' : 'ESGOTADO'}
          </button>
          <button class="btn" onclick="openEditProduct('${p.id}')"><i class="fas fa-pen"></i></button>
          <button class="btn-toggle ${p.is_featured ? 'active' : ''}" onclick="toggleFeatured('${p.id}', ${p.is_featured})">
            <i class="fas fa-star"></i>
          </button>
        </div>
      </div>
    `).join('');
  }

  window.toggleProduct = async (id, current) => {
    const { error } = await supabase.from('products').update({ is_active: !current }).eq('id', id);
    if (!error) {
      showSuccess(!current ? 'Produto disponível!' : 'Produto esgotado!');
      await loadProducts();
    } else showError('Erro ao atualizar status.');
  };

  window.toggleFeatured = async (id, current) => {
    const { error } = await supabase.from('products').update({ is_featured: !current }).eq('id', id);
    if (!error) {
      showSuccess('Destaque atualizado!');
      await loadProducts();
    } else showError('Erro ao atualizar destaque.');
  };

  window.openAddProduct = () => {
    editingProdId = null;
    $('modalProductTitle').textContent = 'Novo Produto';
    $('editProdName').value = '';
    $('editProdPrice').value = '';
    $('editProdDesc').value = '';
    $('editProdImage').value = '';
    $('editProdPortion').value = '';
    renderCategorySelect();
    $('modalEditProduct').style.display = 'flex';
  };

  window.openEditProduct = (id) => {
    const p = products.find(x => x.id === id);
    if(!p) return;
    editingProdId = id;
    $('modalProductTitle').textContent = 'Editar Produto';
    $('editProdName').value = p.name;
    $('editProdPrice').value = p.price;
    $('editProdDesc').value = p.description || '';
    $('editProdImage').value = p.image_url || '';
    $('editProdPortion').value = p.portion || '';
    renderCategorySelect(p.category_id);
    $('modalEditProduct').style.display = 'flex';
  };

  function renderCategorySelect(selectedId) {
    const select = $('editProdCategory');
    select.innerHTML = categories.map(c => `<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${c.name}</option>`).join('');
  }

  window.closeProductModal = () => {
    $('modalEditProduct').style.display = 'none';
    editingProdId = null;
  };

  window.saveProductEdit = async () => {
    const p = {
      name: $('editProdName').value,
      price: parseFloat($('editProdPrice').value),
      description: $('editProdDesc').value,
      image_url: $('editProdImage').value,
      portion: $('editProdPortion').value,
      category_id: $('editProdCategory').value,
      is_active: true
    };

    let error;
    if (editingProdId) {
      ({ error } = await supabase.from('products').update(p).eq('id', editingProdId));
    } else {
      ({ error } = await supabase.from('products').insert([p]));
    }

    if(!error) {
      showSuccess(editingProdId ? 'Produto atualizado!' : 'Produto adicionado!');
      closeProductModal();
      await loadProducts();
    } else {
      console.error(error);
      showError('Erro ao salvar produto.');
    }
  };

  function renderConfig() {
    const status = storeConfig.status || {};
    const hours  = storeConfig.hours  || [];
    const isManualClosed = status.manual_closed;
    const btn = $('btnPanic'), txt = $('panicStatusText');
    btn.textContent = isManualClosed ? 'ABRIR LOJA' : 'FECHAR LOJA';
    btn.className = 'panic-btn ' + (isManualClosed ? 'open' : 'closed');
    txt.textContent = isManualClosed ? 'Loja Fechada Manualmente' : 'Loja Aberta';
    $('configBannerMsg').value = status.banner_msg || '';
    const days = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    $('hoursList').innerHTML = days.map((day, i) => {
      const h = hours.find(x => x.day === i) || { open: '18:00', close: '23:00', closed: false };
      return `<div class="hour-row"><span class="hour-day">${day}</span><input type="time" class="hour-input h-open" value="${h.open}"><input type="time" class="hour-input h-close" value="${h.close}"><input type="checkbox" class="h-closed" ${h.closed ? 'checked' : ''}></div>`;
    }).join('');
  }

  window.togglePanic = async () => {
    const current = storeConfig.status || {};
    const newValue = { ...current, manual_closed: !current.manual_closed };
    await supabase.from('store_config').update({ value: newValue }).eq('key', 'status');
    showSuccess('Status alterado!');
  };

  window.saveBannerMsg = async () => {
    const msg = $('configBannerMsg').value;
    const current = storeConfig.status || {};
    const newValue = { ...current, banner_msg: msg };
    await supabase.from('store_config').update({ value: newValue }).eq('key', 'status');
    showSuccess('Mensagem salva!');
  };

  window.saveHours = async () => {
    const rows = document.querySelectorAll('.hour-row');
    const newHours = Array.from(rows).map((row, i) => ({
      day: i,
      open: row.querySelector('.h-open').value,
      close: row.querySelector('.h-close').value,
      closed: row.querySelector('.h-closed').checked
    }));
    await supabase.from('store_config').update({ value: newHours }).eq('key', 'hours');
    showSuccess('Horários salvos!');
  };

  function updateHeaderStatus() {
    const status = storeConfig.status || {};
    const badge = $('storeStatusBadge');
    if (status.manual_closed) { badge.textContent = 'Fechado'; badge.className = 'store-badge closed'; }
    else { badge.textContent = 'Aberto'; badge.className = 'store-badge open'; }
  }

  function triggerNewOrderAlert(order) {
    startAlarm(); showNewToast(`🔔 Novo pedido de ${order.client_name}`);
  }
  function startAlarm() {
    stopAlarm(); $('alarmOverlay').classList.add('active'); playChime();
    let c = 0; alarmTimer = setInterval(() => { c++; playChime(); if (c>=5) stopAlarm(); }, 1500);
  }
  function stopAlarm() { clearInterval(alarmTimer); $('alarmOverlay').classList.remove('active'); }
  function playChime() {
    try {
      const ctx = _audioCtx || new AudioContext(); _audioCtx = ctx;
      if (ctx.state==='suspended') { ctx.resume(); return; }
      const t = ctx.currentTime;
      const note = (f,s,d) => {
        const o=ctx.createOscillator(), g=ctx.createGain(); o.connect(g); g.connect(ctx.destination);
        o.frequency.value=f; g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(0.3,s+0.05); g.gain.exponentialRampToValueAtTime(0.01,s+d);
        o.start(s); o.stop(s+d);
      };
      note(880,t,0.3); note(1100,t+0.2,0.4);
    } catch(e){}
  }

  window.toggleCard = (id) => $('card-'+id).classList.toggle('open');
  window.removeOrder = (id) => { if(confirm('Remover?')) supabase.from('orders').delete().eq('id', id); };
  window.logout = () => { supabase.auth.signOut(); location.reload(); };
  function showLoading(s) { if(s) $('ordersContainer').innerHTML = '<div class="loading"><div class="spinner"></div>Carregando...</div>'; }
  function showSuccess(m) { const t=$('toastSuccess'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
  function showError(m) { const t=$('toastError'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
  function showNewToast(m) { const t=$('toastNew'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),5000); }

  checkSession();
  $('pin1').focus();
</script>
</body>
</html>
