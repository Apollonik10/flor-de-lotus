<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset PWA</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    button {
      margin-top: 20px;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #d98f7a;
      color: #fff;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div>
    <h1>Reset do App</h1>
    <p>Limpar cache, service worker e dados locais</p>
    <button onclick="resetPWA()">Resetar Agora</button>
  </div>

  <script>
    async function resetPWA() {
      // limpa localStorage
      localStorage.clear();

      // limpa sessionStorage
      sessionStorage.clear();

      // remove service workers
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (let reg of regs) {
          await reg.unregister();
        }
      }

      // limpa caches
      if ('caches' in window) {
        const keys = await caches.keys();
        for (let key of keys) {
          await caches.delete(key);
        }
      }

      alert('Reset completo! Agora recarregue o site.');
    }
  </script>

</body>
</html>
