<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <title>Reset — Flor de Lótus</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #0b0b0b;
      color: #f5f5f5;
      font-family: 'Outfit', system-ui, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    p { font-size: 1rem; opacity: .7; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(217,143,122,.2);
      border-top-color: #d98f7a;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner" role="status" aria-label="Limpando cache..."></div>
  <p id="msg">Limpando cache e dados locais…</p>

  <script>
    'use strict';

    async function doReset() {
      const msg = document.getElementById('msg');

      /* 1. Limpa localStorage */
      localStorage.clear();
      msg.textContent = 'localStorage limpo ✓';

      /* 2. Cancela registros de Service Worker */
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      msg.textContent = 'Service Worker removido ✓';

      /* 3. Limpa todos os caches */
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      msg.textContent = 'Caches limpos ✓ — redirecionando…';

      /* 4. Redireciona após limpeza */
      setTimeout(() => {
        window.location.href = '/page-lotus/index.html';
      }, 800);
    }

    doReset().catch(err => {
      document.getElementById('msg').textContent = 'Erro: ' + err.message;
    });
  </script>
</body>
</html>
